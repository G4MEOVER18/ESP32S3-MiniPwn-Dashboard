; PlatformIO Project Configuration – ESP32S3-MiniPwn-Dashboard
; ESP32-S3 mit 1.47" ST7789-Display (Arduino_GFX). Aktuelle Arduino_GFX-Versionen
; brauchen Arduino-ESP32 Core 3.x → pioarduino-Plattform (gepinnt).
;
; WICHTIG: Vor dem Build wifi_secrets.example.h nach wifi_secrets.h kopieren
; und eigene WLAN-Daten eintragen (wifi_secrets.h ist gitignored).
;
; Build:  pio run   ·   Flash: pio run -t upload   ·   Monitor: pio device monitor -b 115200

[platformio]
src_dir = src/ESP32S3_MiniPwn_Dashboard

[env:esp32-s3-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_size = 16MB
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    moononournation/GFX Library for Arduino@^1.4.9
